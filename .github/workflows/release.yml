name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0) — no tag is created'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'.TrimStart('v')
          } else {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Version '$v' is not in the form MAJOR.MINOR.PATCH."
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Not every hosted Windows image ships Inno Setup, so install it only when it is missing.
      - name: Set up Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # The settings mirror Properties/PublishProfiles/FolderProfile.pubxml — self-contained,
      # single-file, win-x86 (x86 so the build runs on x86 and x64 alike) — spelled out so the
      # version can be stamped. BuildInstaller wraps the published folder with installer/*.iss.
      - name: Publish and build installer (win-x86, self-contained, single-file)
        run: >
          dotnet publish src/PresetSwitcherForSonar/PresetSwitcherForSonar.csproj
          --configuration Release
          --runtime win-x86
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -p:BuildInstaller=true
          -p:InstallerOutputDir=${{ github.workspace }}\dist
          --output publish

      - name: Checksum
        shell: pwsh
        run: |
          $name = "PresetSwitcherForSonar-v${{ steps.version.outputs.version }}-win-x86-setup.exe"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash
          "$hash  $name" | Out-File "dist\$name.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PresetSwitcherForSonar-v${{ steps.version.outputs.version }}-win-x86-setup
          path: |
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error

      # Only a real tag push cuts a GitHub Release; workflow_dispatch stops at the artifact above.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*-setup.exe
            dist/*.sha256
          body: |
            ### Install

            Download and run the `-setup.exe`. It installs for the current user without an
            administrator prompt, and upgrades an earlier installed version in place.
            The build is self-contained — no .NET runtime install required.

            The installer is not code-signed, so Windows SmartScreen may warn on first run:
            **More info → Run anyway**. Verify the download against the accompanying `.sha256` file.

            Requires Windows 10/11 with SteelSeries GG running and the Sonar sub-app enabled.

            Not affiliated with, endorsed by, or supported by SteelSeries.
