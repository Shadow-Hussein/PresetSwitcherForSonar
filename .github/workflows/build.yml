name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', '.gitattributes']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # WPF + net10.0-windows: this cannot cross-compile, a Windows runner is mandatory.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # There are zero NuGet dependencies, so restore is trivial — but keeping it explicit
      # means a future package addition does not silently change build semantics.
      - name: Restore
        run: dotnet restore SonarGamingPresetSwitcher.sln

      - name: Build (${{ matrix.configuration }})
        run: >
          dotnet build SonarGamingPresetSwitcher.sln
          --configuration ${{ matrix.configuration }}
          --no-restore
          -warnaserror

      # No test project exists. This step keeps CI honest if one is ever added:
      # it succeeds loudly when there is nothing to run, rather than pretending tests passed.
      - name: Test
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Recurse -Filter *Tests*.csproj
          if ($projects.Count -eq 0) {
            Write-Host '::notice::No test projects found — skipping.'
          } else {
            dotnet test SonarGamingPresetSwitcher.sln `
              --configuration ${{ matrix.configuration }} --no-build --verbosity normal
          }
